name: build-comment

# Post or refresh the artifact download comment on the PR behind a build run.
#
# It runs from the default branch with a write token, which is what makes it
# work for PRs opened from forks: there, the build workflow only receives a
# read-only GITHUB_TOKEN and cannot comment (403 Resource not accessible by
# integration). The rows come from the artifacts the run actually produced:
# every format links to its own artifact and Todos to the bundle with all
# three, so a failed build reports what is missing.
#
# workflow_dispatch re-posts the comment for an existing run (e.g. after an
# outage or a deleted comment): pass the run id from the Actions URL.

on:
  workflow_run:
    workflows: ["build"]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: "Build run id to post the artifact comment for"
        required: true

permissions:
  actions: read
  contents: read
  pull-requests: write

concurrency:
  # One comment job per source branch, queued rather than cancelled, so two
  # builds of the same PR cannot race to create duplicate comments.
  group: build-comment-${{ github.event.workflow_run.head_repository.full_name }}:${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  comment:
    # Push and manual builds have no PR to comment on, and a cancelled run is
    # superseded by the run that cancelled it, which will comment itself.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion != 'cancelled')
    runs-on: ubuntu-latest
    steps:
      - name: Create or update PR comment
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const repoFull = `${owner}/${repo}`;
            const marker = '<!-- paper-build-artifacts -->';

            const run = context.eventName === 'workflow_dispatch'
              ? (await github.rest.actions.getWorkflowRun({
                  owner,
                  repo,
                  run_id: Number(context.payload.inputs.run_id),
                })).data
              : context.payload.workflow_run;

            const runUrl = `https://github.com/${repoFull}/actions/runs/${run.id}`;
            const artifactsUrl = `${runUrl}#artifacts`;

            // The payload usually carries the PR, but for PRs from forks
            // GitHub leaves pull_requests empty, so fall back to the head
            // repository/branch the run came from.
            let prNumber = run.pull_requests?.[0]?.number;
            if (!prNumber && run.head_branch && run.head_repository?.owner?.login) {
              const { data: prs } = await github.rest.pulls.list({
                owner,
                repo,
                state: 'open',
                head: `${run.head_repository.owner.login}:${run.head_branch}`,
                base: context.payload.repository?.default_branch,
                per_page: 100,
              });
              const match = prs.find((pr) => pr.head.sha === run.head_sha) ?? prs[0];
              prNumber = match?.number;
            }
            if (!prNumber) {
              core.info(`No open pull request for run ${run.id}; nothing to comment.`);
              return;
            }

            // One row per paper in the run: each format links to its own
            // artifact, and Todos keeps the one-click bundle with all three.
            const { data: artifacts } = await github.rest.actions.listWorkflowRunArtifacts({
              owner,
              repo,
              run_id: run.id,
              per_page: 100,
            });
            const byName = new Map(artifacts.artifacts.map((art) => [art.name, art]));
            const link = (art, label) =>
              art ? `[⬇ ${label}](${runUrl}/artifacts/${art.id})` : '—';
            const slugs = [...new Set(
              [...byName.keys()]
                .filter((name) => name.startsWith('paper-'))
                .map((name) => name.replace(/^paper-/, '').replace(/-(pdf|docx|latex)$/, '')),
            )].sort();
            const rows = slugs.map((slug) => {
              const all = byName.get(`paper-${slug}`);
              // Runs predating the per-format split only carry the combined
              // artifact: fall back to it so the cells still download.
              const pdf = byName.get(`paper-${slug}-pdf`) ?? all;
              const docx = byName.get(`paper-${slug}-docx`) ?? all;
              const latex = byName.get(`paper-${slug}-latex`) ?? all;
              return `| ${slug} | ✅ | ${link(pdf, 'PDF')} | ${link(docx, 'DOCX')} | ${link(latex, 'LaTeX')} | ${link(all, 'Todos')} |`;
            });
            if (run.conclusion !== 'success') {
              rows.push(`| — | ❌ | El build terminó con \`${run.conclusion}\`; revisa los [logs](${runUrl}). | — | — | — |`);
            }
            if (rows.length === 0) {
              rows.push('| — | ⏭️ | No se generó ningún artifact en este run. | — | — | — |');
            }

            const body = [
              marker,
              '### 📦 Paper build artifacts',
              '',
              '| Paper | Status | PDF | DOCX | LaTeX | Todos |',
              '|-------|--------|-----|------|-------|-------|',
              ...rows,
              '',
              `> Los artifacts están disponibles en la pestaña [Checks → Artifacts](${artifactsUrl}). Se eliminan después de 90 días.`,
            ].join('\n');

            // Refresh the bot's previous comment in place when it exists.
            const { data: comments } = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number: prNumber,
              per_page: 100,
            });
            const existing = comments.find(
              (c) => c.user?.login === 'github-actions[bot]' && c.body?.includes(marker),
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: prNumber,
                body,
              });
            }
            core.info(`Comment ${existing ? 'updated' : 'created'} on PR #${prNumber}.`);
