# papers/c20-2026/manifest.yaml
# Single source of truth for this paper's metadata. Does NOT duplicate author
# data: it references authors/<id>.yaml by id only.

paper: c20-2026
title: "Hybrid machine learning and dynamical forecasts for subseasonal temperature prediction at high-Andean stations: a blind benchmark with foundation models and conformal calibration"

# --- Editorial target ---
journal: engineering-applications-of-artificial-intelligence          # must exist under templates/journals/<journal>/
internal_code: "C20-2026" # institutional code (empty "" if none)

# --- Funding / institution ---
institution: "Servicio Nacional de Adiestramiento en Trabajo Industrial"
funding: "This work was funded by the Servicio Nacional de Adiestramiento en Trabajo Industrial, Peru (Project C20-2026)."             # exact text for the paper's Funding section

# --- Authors (id + role + order for THIS paper only) ---
# Full details (name, orcid, email, affiliation) live in authors/<id>.yaml
authors:
  - id: moises
    role: corresponding
    order: 1
  - id: jeremi
    role: author
    order: 2

# --- Claims: verifiable statements made by the paper ---
# Each claim anchors a number/result in the text to its origin in the pipeline,
# so paper-refs and the reviewers can audit that nothing was fabricated.
# status: draft (written from the run of record, not yet quoted in the
# manuscript) | verified (checked against the file by gate-claims) | stale
# (the file has moved on). Every source is a file in outputs/.
claims:
  - id: claim-h1-ridge
    text: "Blind folds: Ridge_LG beats Ridge_L at every horizon (Clark-West 4.10/4.56/4.55; Holm p = 2.1e-5/8e-6/8e-6) and its CRPS is lower (delta CRPS 0.22/0.34/0.41 degC; Holm p = 0.016/0.0087/0.0087 at W1/W2/W3_4)."
    source: "outputs/tables/T3_hypotheses.csv"
    status: draft
  - id: claim-h1-gbm
    text: "The large-scale predictors help GBM at W2 and W3_4 but not W1: block-bootstrap delta MSE Holm p = 0.105/0.027/0.020, delta CRPS Holm p = 0.264/0.048/0.004 (W1/W2/W3_4)."
    source: "outputs/tables/T3_hypotheses.csv"
    status: draft
  - id: claim-h2
    text: "M* (Ensemble) beats damped persistence at W3_4 on the blind folds: MSSS_damp = 0.409, one-sided 95% lower bound 0.339, p = 1e-4."
    source: "outputs/tables/T3_hypotheses.csv"
    status: draft
  - id: claim-h3
    text: "M* has probabilistic skill against Clim at every horizon (CRPSS_clim 0.295/0.298/0.345; Holm p = 3e-4) but its blind 90% interval covers 0.75/0.69/0.63 of the outcomes, below the pre-registered 0.85-0.95."
    source: "outputs/tables/T3_hypotheses.csv"
    status: draft
  - id: claim-h4
    text: "Against the CFSv2 reference, delta CRPS(CFS_BC - M*) is -0.419 (W1), 0.001 (W2) and 0.383 degC (W3_4): M* wins only at W3_4 (Holm p = 0.0117); the other two horizons are non-rejections."
    source: "outputs/tables/T3_hypotheses.csv"
    status: draft
  - id: claim-mstar-selection
    text: "M* = Ensemble, chosen on dev CRPS 0.3926 degC against Ridge_LG 0.3943, LSTM_LG 0.3946 and GBM_LG 0.4207 (0.4% margin over Ridge_LG), with inverse-dev-CRPS weights giving Chronos 21.8-22.1%."
    source: "outputs/models/primary_model.json"
    status: draft
  - id: claim-calibration-k
    text: "Post hoc (A2): a dev-fitted spread factor k = 1.46-1.63 raises the blind 90% coverage of the Ensemble to 0.899/0.899/0.875 and its CRPSS_clim to 0.311/0.324/0.380 (W1/W2/W3_4)."
    source: "outputs/tables/T9_calibration.csv"
    status: draft
  - id: claim-chronos-diagnosis
    text: "Chronos' daily sample paths cover 0.20-0.22 of the observed daily anomalies (nominal 0.90) with a spread of 0.18-0.24 degC against a median RMSE of 1.12-1.32 degC, in dev and blind alike, so window averaging is not the cause of its narrow windows."
    source: "outputs/tables/T10_chronos_diagnostic.csv"
    status: draft
  - id: claim-chronos-input
    text: "On D3, absolute-temperature context lifts Chronos' daily 90% coverage from 0.20-0.22 to 0.75-0.78 and lowers CRPS by about 13% at W1 and W2 (0.46 vs 0.53, 0.52 vs 0.60 degC); float32 and bfloat16 give the same paths."
    source: "outputs/tables/T11_chronos_sensitivity.csv"
    status: draft
  - id: claim-loso
    text: "Under LOSO on the blind folds GBM_LG keeps CRPSS_clim > 0 at every held-out station and horizon (0.023-0.349), and its paired CRPS change against the temporal experiment stays within -0.025 to +0.066 degC per station and horizon."
    source: "outputs/tables/T5_loso_gap.csv"
    status: draft

  # --- Claims quoted in main.qmd (manuscript draft 2026-10-08) ---
  - id: claim-qc
    text: "416,273 station-hours; 13,268 (3.2%) carry no variable; 428 temperature spikes and 2,114 stuck-sensor hours flagged; 3,469 days per station, 2015-01-01 to 2024-06-30."
    source: "outputs/manifest_index.json"
    status: draft
  - id: claim-blind-sample
    text: "Blind folds: 102/100/96 issuance dates and 506/497/478 station forecasts at W1/W2/W3_4."
    source: "outputs/tables/T16_hybrid_cfs.csv"
    status: draft
  - id: claim-blind-skill
    text: "Blind CRPSS_clim (95% CI): CFS_BC 0.415 (0.32-0.50) / 0.298 / 0.218 (0.14-0.28); Ridge_LG 0.297/0.324/0.385; LSTM_LG 0.273/0.309/0.378; M* 0.295 (0.20-0.39) / 0.298 (0.20-0.38) / 0.345 (0.24-0.43)."
    source: "outputs/tables/T2_blind_skill.csv"
    status: draft
  - id: claim-comparative-metrics
    text: "Comparative blind metrics (Table 5): at W3_4 Ridge_LG RMSE 0.612 degC and MSSS_clim 0.598; ACC 0.794 (LSTM_LG) and 0.795 (M*); raw Chronos ACC 0.64-0.69."
    source: "outputs/tables/metrics_long.csv"
    status: draft
  - id: claim-ec-sensitivity
    text: "Replacing Nino 3.4/1+2 by the E/C indices changes the CRPSS_clim of Ridge_LG and GBM_LG by at most 0.02."
    source: "outputs/tables/metrics_long.csv"
    status: draft
  - id: claim-h5-mstar2
    text: "M*2 (with Chronos@abs, Vincentization, conformal) beats M*: delta CRPS 0.098/0.159/0.241 (Holm p 0.0016/0.0016/0.0012); blind 90% coverage 0.903/0.887/0.866; CRPSS_clim 0.323/0.348/0.426."
    source: "outputs/tables/T14_mstar2_blind.csv"
    status: draft
  - id: claim-mstar2-selection
    text: "Selected configuration: dev CRPS 0.382 degC, dev coverage 0.892/0.900/0.904; EMOS has the best blind CRPS (0.398 vs 0.415) but higher dev CRPS (0.395)."
    source: "outputs/tables/T13_mstar2_selection.csv"
    status: draft
  - id: claim-h6-hybrid
    text: "Hybrid Ridge_LG@CFS: CRPSS_clim 0.424 (0.34-0.50) / 0.384 (0.26-0.50) / 0.411 (0.28-0.53); vs CFS_BC delta CRPS 0.031 (p 0.26) / 0.274 (Holm 0.012) / 0.579 (0.0024); vs M* 0.450/0.273/0.196 (Holm 0.0003/0.017/0.031); vs same-rows control 0.462/0.262/0.035 (Holm 0.0003/0.012/0.026); coverage 0.836/0.843/0.812."
    source: "outputs/tables/T16b_hybrid_tests.csv"
    status: draft
  - id: claim-hybrid-others
    text: "GBM hybrid coverage 0.47-0.70 and worse than CFS_BC (Holm p = 1); blend matches CFS_BC at W1 and beats it at W3_4 (Holm 0.0012) but is worse than M* at W3_4."
    source: "outputs/tables/T16_hybrid_cfs.csv"
    status: draft
  - id: claim-cfs-correlation
    text: "Correlation of the bias-corrected CFSv2 anomaly with the observed anomaly on the blind folds (mean over stations and folds): 0.70 (W1), 0.44 (W2), 0.21 (W3_4)."
    source: "outputs/tables/T8_cfs_calibration.csv"
    status: draft
  - id: claim-mstar-pit
    text: "M* PIT at W3_4 on the blind folds: 17% of outcomes in the lowest decile and 32% in the highest."
    source: "outputs/tables/T15_pit_reliability.csv"
    status: draft
  - id: claim-chronos-variants
    text: "Blind window-mean 90% coverage and width: raw Chronos 0.22-0.31, 0.49-0.61 degC; Chronos@abs 0.74-0.86, 2.03-2.38 degC (CRPSS 0.271/0.256/0.320); Chronos-Bolt 0.90-0.95, 3.05-3.49 degC (CRPSS 0.18-0.22)."
    source: "outputs/tables/metrics_long.csv"
    status: draft
  - id: claim-conditional
    text: "M* CRPSS_clim by ENSO phase: El Nino 0.37-0.43 (n 240-250), La Nina 0.16-0.23 (n 175), neutral 0.06-0.20 (n 63-81); DJF 0.39-0.46, JJA 0.15-0.31; MJO active 0.32-0.38, inactive 0.26-0.32."
    source: "outputs/tables/T7_conditional_skill.csv"
    status: draft
  - id: claim-loso-mstar
    text: "LOSO: M* CRPS increases by at most 0.052 degC; no increase at Carania and Imata; San Jose de Uzuna W3_4 CRPSS 0.41 to 0.34, Matucana 0.44 to 0.33."
    source: "outputs/tables/T5_loso_gap.csv"
    status: draft
  - id: claim-seeds
    text: "Five seeds: CRPSS_clim SD <= 0.005 (GBM) and <= 0.020 (LSTM_LG); GBM_L never beats GBM_LG or LSTM_LG and GBM_LG never beats LSTM_LG in any seed."
    source: "outputs/tables/T12_seed_variability.csv"
    status: draft
  - id: claim-secondary
    text: "Ridge_LG on TT_min: CRPSS_clim 0.205/0.225/0.282; frost Brier skill 0.134/0.265/0.291."
    source: "outputs/tables/T6_secondary_targets.csv"
    status: draft

