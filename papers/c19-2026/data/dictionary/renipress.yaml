  original_name: INSTITUCION
  dtype: string
  role: attribute
  description: Institution that operates the facility (PRIVADO, GOBIERNO REGIONAL, MINSA, ESSALUD, OTRO,
    the armed-forces and police health services, municipalities, INPE).
  notes: 12 distinct values.
