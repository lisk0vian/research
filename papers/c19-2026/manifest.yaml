paper: c19-2026
title: "Who is far from hospital care depends on how access is measured: travel time to public complex hospitals in Peru"   # chosen by the researchers on 2026-11-01

# --- Editorial target ---
journal: applied-geography          # must exist under templates/journals/<journal>/
internal_code: "C19-2026" # institutional code (empty "" if none)

# --- Funding / institution ---
institution: "SENATI"
funding: "This work was funded by SENATI, Peru (Project C19-2026)."             # exact text for the paper's Funding section

# --- Authors (id + role + order for THIS paper only) ---
# Full details (name, orcid, email, affiliation) live in authors/<id>.yaml
authors:
  - id: moises
    role: corresponding
    order: 1

# --- Claims: verifiable statements made by the paper ---
# Each claim anchors a number/result in the text to its origin in the pipeline,
# so paper-refs and the reviewers can audit that nothing was fabricated.
claims:
  - id: claim-1
    text: "National person-weighted (grid-cell) mean travel time to the nearest public complex hospital (MINSA + regional government, level II-1+) is 37.8 min; 10.9 % of the population lives in cells over 60 min away and 4.6 % over 120 min. The district-weighted mean is 91.6 min; the headline is always the person-weighted figure. 120 min is a secondary threshold: friction and OSRM agree weakly on the 120-min class (kappa 0.342 on the enriched 348-centroid sample, 0.350 outside the Amazon proxy; post hoc), so no absolute-minutes statement is made at 120."
    source: "outputs/04_access_sensitivity/summary.json; outputs/03_access_travel_time/osm_secondary.csv"
    status: draft
  - id: claim-2
    text: "Against OSRM routing on OpenStreetMap (a convergent check, not an independent one: both engines use OSM roads), the pre-specified 200-centroid sample (199 routed) agrees at Spearman 0.738. The pre-specified rule (rho >= 0.80 outside the Amazon) was frozen on the departmental proxy: 0.801 (bootstrap 95 % CI 0.733-0.854, n = 174), so the point estimate passes and the CI crosses 0.80. With the HydroBASINS basin (post hoc) rho is 0.850 (0.752-0.912, n = 86) outside and 0.653 (0.489-0.790, n = 113) inside the basin; 0.513 (-0.057-0.919, n = 17) in the lowland basin below 500 m and 0.705 (0.575-0.818, n = 96) at 500 m or more."
    source: "outputs/02_regions/osm_stratified.csv; outputs/10_figures_tables/tables/table3_engine.csv"
    status: draft
  - id: claim-3
    text: "The share of people far from care depends on the unit that is classified (a scale effect): 10.9 % live in grid cells over 60 min, but 12.5 % live in districts whose person-weighted mean exceeds 60 min (4.6 % vs 5.5 % at 120 min). The Ridge-calibrated friction (ML A) moves the district-mean shares to 14.4 % (>60) and 4.2 % (>120). Placing the 2 grossly misplaced hospitals at their district centroid (M6) changes the 60-min class of 1.12 % of districts (threshold 5 %). Excluding the 12 provinces that contain the 21 census districts without a polygon gives 10.6 % (>60) and 4.4 % (>120) over the remaining 1,759 districts."
    source: "outputs/04_access_sensitivity/summary.json; outputs/09_ml_checks/calibrated_share.json; outputs/03_access_travel_time/checks.json"
    status: draft
  - id: claim-4
    text: "Among deaths due to causes amenable to hospital care (n = 70,496; 2022-2025), a +60-min increase in access time is associated with an OR of 1.005 (95 % CI 0.986-1.025, p = 0.607) for dying outside a health facility, adjusted for age, sex, cause group, district altitude and department fixed effects."
    source: "outputs/08_validation_models/summary.json"
    status: draft
  - id: claim-5
    text: "The same model over all causes (n = 590,654, exploratory) gives OR 1.037 (1.023-1.052); the cancer negative control shows the same small, non-significant gradient (1.032, 0.978-1.090), so the association is not specific to access-sensitive causes: it is driven by the 'other' cause group (1.053, 1.034-1.071)."
    source: "outputs/08_validation_models/summary.json"
    status: draft
  - id: claim-6
    text: "The known-truth simulation (district random intercept, SD 0.551; 500 null and 3 x 200 planted replications) gives a false-positive rate of 7.6 % (Monte Carlo SE 1.2 %) against the pre-specified <= 7 %, bias within 1 %, and 95 % CI coverage of 90.0 % (MCSE 2.1) at OR 1.1, 92.5 % (1.9) at 1.2 and 93.5 % (1.7) at 1.5 (target 92-97 %). Per the plan rule the model is not used for confirmatory inference: RQ3 is reported as descriptive."
    source: "outputs/08_validation_models/summary.json; outputs/08_validation_models/simulation_summary.csv"
    status: draft
  - id: claim-7
    text: "ML A: the regularized linear calibration of log(OSRM/friction) wins leave-one-department-out validation over the constant-ratio baseline on MAPE (0.585 vs 2.056) and in the remote tail (Spearman 0.602 vs 0.431); the kappa-60 margin (0.691 vs 0.686) is noise and is not a selling point. It is used as the calibrated_min sensitivity variant, never as the headline."
    source: "outputs/09_ml_checks/calibration.json"
    status: draft
  - id: claim-8
    text: "ML B: access time adds small, non-specific predictive value for dying outside a facility among all causes (delta-Brier 0.00313, 95 % CI 0.00173-0.00479; permutation drop 0.00395), the same non-amenable gradient as claim-5 and not evidence of access-specificity, and no positive predictive contribution among amenable causes (delta-Brier -0.00292, 95 % CI -0.00574 to -0.00012), consistent with the null H3a."
    source: "outputs/09_ml_checks/predictive.json"
    status: draft

  - id: claim-9
    text: "Straight-line distance from the district centre and population-weighted straight-line distance rank districts much like travel time (Spearman 0.902, 95 % CI 0.891-0.914; 0.923, 0.912-0.934) but disagree on who is deficient: flagging the same number of districts (quantile matching: 746 at 60 min, 235 at 120 min), kappa is 0.739 and 0.777 at 60 min and 0.582 and 0.538 at 120 min, and the top-100 worst-access sets overlap at Jaccard 0.429 and 0.351. The pre-specified refutation criterion for travel time (Spearman >= 0.95 and kappa >= 0.90) is not met."
    source: "outputs/04_access_sensitivity/stability.csv"
    status: draft
  - id: claim-10
    text: "The destination-set choice does not drive the result: public + EsSalud, all complex hospitals and all + uncategorised hospital-like variants keep Spearman 0.991-0.993, kappa 0.978-0.990 at 60 min and 0.988-0.998 at 120 min, and top-100 Jaccard 0.980 against the main public-only set."
    source: "outputs/04_access_sensitivity/stability.csv"
    status: draft
  - id: claim-11
    text: "2SFCA (supply = hospitals per coarse cell, person-weighted district value) orders districts differently from travel time: Spearman 0.524 (0.483-0.562) with a 60-min and 0.306 (0.256-0.348) with a 120-min catchment. Flagging as many districts as travel time, kappa at 60 min is 0.539 and 0.271; districts with no hospital in the catchment (score 0) agree with the >60-min class at kappa 0.418 and 0.326. With a 60-min catchment 14.9 % of districts (4.2 % of people) score zero, so the top-100 overlap is undefined there (0.504 at 120 min)."
    source: "outputs/04_access_sensitivity/stability.csv"
    status: draft
  - id: claim-12
    text: "Need x access (M5): 371 districts (739,935 people, 2.3 % of the population) are high need with deficient access; membership is stable across the five need-weighting schemes (97.3 %, threshold 80 %), but the need index itself is weight-dependent (minimum Kendall tau 0.729 against the equal-z ranking, threshold 0.80), so only quadrant membership is shown, never a composite ranking. Spatial structure (M7): global Moran's I of person-weighted travel time is 0.662 (queen), 0.656 (k = 4) and 0.547 (k = 8), each p = 0.0001 with 9,999 permutations; local clusters vary across weight matrices (235/266/456 districts; variation 69 % vs 25 % maximum), so they are not reported as findings."
    source: "outputs/05_need_priority/summary.json; outputs/05_need_priority/stability_weights.csv; outputs/06_spatial_stats/moran.csv; outputs/06_spatial_stats/stability.json"
    status: draft
  - id: claim-13
    text: "Person weighting matters (M2): travel time read at the district centre cell correlates with the person-weighted measure at Spearman 0.810 (0.788-0.830), below the pre-specified 0.95 at which the centroid would suffice, and flags 1,010 instead of 746 districts as deficient at 60 min (537 instead of 235 at 120 min)."
    source: "outputs/04_access_sensitivity/stability.csv"
    status: draft
  - id: claim-14
    text: "On foot, 46.5 % of people live over 60 min and 31.3 % over 120 min from a public complex hospital (person-weighted mean 226.8 min). Walking time ranks districts like motorized time (Spearman 0.958, 0.951-0.964) but at 60 min flags 1,686 of 1,872 districts."
    source: "outputs/04_access_sensitivity/summary.json; outputs/04_access_sensitivity/stability.csv"
    status: draft
  - id: claim-15
    text: "Unknown cause of death is more frequent outside facilities, most of all where hospitals are near: 22.5 % vs 12.9 % in facilities in the <=30-min band, 13.5 % vs 10.0 % at 30-60, 10.9 % vs 10.9 % at 60-120 and 11.3 % vs 9.1 % above 120 min. If unknown-cause deaths are amenable in similar proportion across bands, excluding them removes more outside deaths near hospitals, which would steepen, not flatten, the H3a gradient (descriptive)."
    source: "outputs/08_validation_models/unknown_cause_by_place_time.csv"
    status: draft

  - id: claim-16
    text: "The 2025 census counted 32,706,028 residents in 1,893 districts. Of these, 21 districts have no polygon (294,298 residents) and one polygon (Mazamari-Pangoa, 120699) has no census row, so the analysis covers 1,872 districts and 32,411,730 people, 99.1 % of the counted population."
    source: "outputs/02_geo_inputs/summary.json; outputs/10_figures_tables/derived_numbers.json; outputs/10_figures_tables/tables/table2_equity.csv"
    status: draft
  - id: claim-17
    text: "Of the 182 geolocated public complex hospitals, 172 lie inside their own district polygon, 7 within 20 km of its boundary, 2 more than 200 km away (coordinate errors, excluded from the main set) and 1 in a district without a polygon; the 180 hospitals of the main set occupy 174 grid cells."
    source: "outputs/03_access_travel_time/checks.json; outputs/03_access_travel_time/hospitals_audit.csv"
    status: draft
  - id: claim-18
    text: "OSRM times were longer than friction times in the pre-specified sample (median OSRM/friction ratio 1.17) and shorter in the lowland Amazon basin (0.82). For six pairs of departmental capitals the mean absolute percentage difference between the engines was 18.0 % (largest 38.1 %, Huancayo-Ayacucho)."
    source: "outputs/10_figures_tables/tables/table3_engine.csv; outputs/10_figures_tables/derived_numbers.json; outputs/03_access_travel_time/city_pairs.csv"
    status: draft
  - id: claim-19
    text: "Flagging the same 746 districts at 60 min, travel time and population-weighted straight-line distance (cut at the matched 33.1 km) disagree on 100 + 100 districts; 79 of the 100 flagged only by travel time are in the Amazon basin and 52 lie at 500-2,500 m, whereas 57 of the 100 flagged only by distance lie at 3,500 m or more."
    source: "outputs/10_figures_tables/derived_numbers.json; outputs/10_figures_tables/Fig3_methods.csv"
    status: draft
  - id: claim-20
    text: "Of 601,092 deaths registered in 2022-2025, 593,438 entered the model frame, 590,654 had the district resolved by name and 70,496 of these were due to amenable causes; the within-department placebo (200 permutations) gave p = 0.61."
    source: "outputs/07_outcome_sinadef/sinadef_accessed.json; outputs/08_validation_models/summary.json"
    status: draft
  - id: claim-21
    text: "86.3 % of the 371 high-need districts with deficient access lie at a mean altitude of 2,500 m or more."
    source: "outputs/10_figures_tables/derived_numbers.json"
    status: draft
  - id: claim-22
    text: "Population within 60 min: 93.1 % below 500 m, 88.2 % at 2,500-3,500 m, 85.6 % at 3,500 m or more and 83.8 % at 500-2,500 m (91.9 % within 120 min, the lowest band); at 3,500 m or more 66.0 % live within 30 min and 97.4 % within 120 min."
    source: "outputs/10_figures_tables/Fig2_access.csv"
    status: draft
  - id: claim-23
    text: "Inside the Amazon basin 22.8 % of residents live more than 60 min from a public complex hospital, against 5.6 % outside it; in the lowland basin below 500 m the person-weighted mean is 274.2 min."
    source: "outputs/10_figures_tables/tables/table2_equity.csv"
    status: draft
  - id: claim-24
    text: "Exchangeable GEE: OR 0.992 (0.977-1.009), opposite sign to the main estimate, so the pre-specified same-sign criterion fails. H3b: acute 1.000 and chronic 1.020, interaction p = 0.251. The known-truth simulation covered the planted OR of 1.10 in 90.0 % of replications and detected it with power 0.99. Registration completeness correlates with travel time at r = -0.108 (flag |r| > 0.30)."
    source: "outputs/08_validation_models/summary.json; outputs/08_validation_models/h3b_cause_groups.csv; outputs/08_validation_models/simulation_summary.csv"
    status: draft

