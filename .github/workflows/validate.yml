name: validate

# Gate every pull request on the repository structure contract. A PR that
# touches papers, the shared catalogs, the scripts or the skills must keep the
# folder layout, manifests and naming rules valid (see AGENTS.md).

on:
  pull_request:
    paths:
      - "papers/**"
      - "authors/**"
      - "templates/**"
      - "scripts/**"
      - "tests/**"
      - ".agents/skills/**"
      - ".github/workflows/validate.yml"
      # The gate itself depends on these: a dependency or a testpaths change
      # is exactly what would break collection without touching any of the above.
      - "requirements-dev.txt"
      - "pytest.ini"
  push:
    branches: [main, master]
    paths:
      - "papers/**"
      - "authors/**"
      - "templates/**"
      - "scripts/**"
      - "tests/**"
      - ".agents/skills/**"
      - "requirements-dev.txt"
      - "pytest.ini"
  workflow_dispatch:

jobs:
  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: pip install -r requirements-dev.txt

      - name: Validate repository structure
        run: python scripts/paper_validate.py

      - name: Run tests
        # Per-paper suites (papers/*/tests) are marked slow by
        # papers/conftest.py and skipped here: a pull request is checked against
        # the repository contract in seconds. They are still collected locally
        # by plain `pytest -q` and must pass before a release.
        run: pytest -q -m "not slow"
