name: build

# Render changed papers to PDF + DOCX + LaTeX zip and upload as artifacts.
# The download comment is posted by build-comment.yml (workflow_run): a PR
# opened from a fork gets a read-only GITHUB_TOKEN here, so this workflow
# cannot comment on it. Cancels superseded runs.

on:
  pull_request:
    paths:
      - "papers/*/paper/main.qmd"
      - "papers/*/paper/references.bib"
      - "papers/*/paper/media/**"
  push:
    branches: [main, master]
    paths:
      - "papers/*/paper/main.qmd"
      - "papers/*/paper/references.bib"
      - "papers/*/paper/media/**"
  workflow_dispatch:
    inputs:
      slug:
        description: "Paper slug (e.g. c15-2026). Leave empty to build all changed."
        required: false

permissions:
  contents: read

concurrency:
  group: build-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  # ── Job 1: detect which papers changed ──────────────────────────────────
  detect:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # full history for diff

      - name: Detect changed papers
        id: set-matrix
        run: |
          set -euo pipefail

          # Manual dispatch with explicit slug
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ inputs.slug }}" ]]; then
            echo 'matrix=[{"slug":"${{ inputs.slug }}"}]' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Determine base ref for diff
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE="origin/${{ github.base_ref }}"
          else
            BASE="HEAD~1"
          fi

          # Find changed main.qmd / references.bib / media/ and extract slugs
          SLUGS=$(git diff --name-only "$BASE" HEAD -- \
            'papers/*/paper/main.qmd' \
            'papers/*/paper/references.bib' \
            'papers/*/paper/media/**' \
            2>/dev/null \
            | grep -oP 'papers/\K[^/]+' \
            | sort -u \
            || true)

          if [[ -z "$SLUGS" ]]; then
            echo 'matrix=[]' >> "$GITHUB_OUTPUT"
          else
            JSON=$(printf '%s\n' "$SLUGS" | jq -R . | jq -sc '[{slug: .[]}]')
            echo "matrix=$JSON" >> "$GITHUB_OUTPUT"
          fi

  # ── Job 2: build each changed paper ─────────────────────────────────────
  build:
    needs: detect
    if: needs.detect.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        paper: ${{ fromJson(needs.detect.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install pyyaml

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tinytex: true

      - name: Build paper
        id: build
        run: |
          set -euo pipefail
          slug="${{ matrix.paper.slug }}"
          echo "::group::Building $slug"
          python scripts/paper_build.py --slug "$slug" --format all
          echo "::endgroup::"
          echo "slug=$slug" >> "$GITHUB_OUTPUT"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: paper-${{ matrix.paper.slug }}
          path: |
            papers/${{ matrix.paper.slug }}/build/${{ matrix.paper.slug }}.pdf
            papers/${{ matrix.paper.slug }}/build/${{ matrix.paper.slug }}.docx
            papers/${{ matrix.paper.slug }}/build/${{ matrix.paper.slug }}-latex.zip
          if-no-files-found: warn
          retention-days: 90
