name: validate

# Gate every pull request on the repository structure contract. A PR that
# touches papers, the shared catalogs, the scripts or the skills must keep the
# folder layout, manifests and naming rules valid (see AGENTS.md).

on:
  pull_request:
    paths:
      - "papers/**"
      - "authors/**"
      - "templates/**"
      - "scripts/**"
      - "tests/**"
      - ".agents/skills/**"
      - ".agents/agents/**"
      - ".github/workflows/validate.yml"
      # The gate itself depends on these: a dependency or a testpaths change
      # is exactly what would break collection without touching any of the above.
      - "requirements-dev.txt"
      - "pytest.ini"
  push:
    branches: [main, master]
    paths:
      - "papers/**"
      - "authors/**"
      - "templates/**"
      - "scripts/**"
      - "tests/**"
      - ".agents/skills/**"
      - ".agents/agents/**"
      - "requirements-dev.txt"
      - "pytest.ini"
  workflow_dispatch:

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      refs: ${{ steps.filter.outputs.refs }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            refs:
              - 'papers/**/paper/references.bib'
              - 'papers/**/paper/main.qmd'

  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: pip install -r requirements-dev.txt

      - name: Validate repository structure
        run: python scripts/paper_validate.py

      - name: Run tests
        # Two suites are marked slow and skipped here: papers/*/tests (~35s,
        # each case refits climatologies) and tests/test_cas_fidelity.py
        # (~29s, compiles LaTeX against a committed reference PDF). Measured:
        # this gate runs 51 tests in ~5s against ~66s for plain `pytest -q`.
        # Both stay collected locally and must pass before a release.
        run: pytest -q -m "not slow"

  doi-check:
    runs-on: ubuntu-latest
    needs: changes
    # Runs only when references can actually change; otherwise it would
    # re-audit every DOI on PRs that only touch code, scripts or docs.
    # Manual runs always audit (workflow_dispatch has no diff to filter).
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.refs == 'true'
    # Runs on every PR that touches papers/scripts, on push to main, and on manual trigger
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate DOIs
        # Non-blocking: preprint DOIs (arXiv, bioRxiv) are skipped,
        # network errors are tolerated. Only real not_found DOIs fail.
        run: python scripts/doi_validate.py --ci --json --quiet --timeout 15 --delay 0.2

      - name: Upload DOI report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: doi-audit
          path: doi_validate_report.json
