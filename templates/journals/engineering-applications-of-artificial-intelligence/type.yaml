notes: >
  IFAC journal. Double anonymized review (title page + anonymized manuscript separate). Single-column format (desk-reject if not). Abstract max 250 words, must state AI contribution + engineering application, no undefined acronyms in title/abstract. Keywords 1-6. Highlights 3-5 x max 85 chars encouraged. Graphical abstract 531x1328 encouraged. SI units + up to 6 Inspec codes. CRediT required. References authoryear (Allan 2020a, Allan and Jones 2019, Kramer et al. 2023), alphabetical then chronological, LTWA abbreviations. Data Option C: deposit + cite/link dataset, Data statement required. Max 50 pages, <100MB. Source: Guide for Authors 30/9/26, https://www.sciencedirect.com/journal/engineering-applications-of-artificial-intelligence/publish/guide-for-authors
