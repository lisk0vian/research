    source: "outputs/figures_article/Fig1_framework_en.png"
  - id: fig-2
    caption: "Reports recorded, 2019-2025. (a) Annual total and change from the previous year. (b) Monthly total."
    file: "media/Fig2_reports_en.png"
    source: "outputs/figures_article/Fig2_reports_en.png"
  - id: fig-3
    caption: "Territorial comparison of rates, 2019-2025. (a) Classification with FDR control. (b) Rate ratios and 95% CIs."
    file: "media/Fig3_priority_en.png"
    source: "outputs/figures_article/Fig3_priority_en.png"
  - id: fig-4
    caption: "Annual rate ratios relative to the rest of the country, 2019-2025."
    file: "media/Fig4_persistence_en.png"
    source: "outputs/figures_article/Fig4_persistence_en.png"
  - id: fig-5
    caption: "Diagnostics and state profiles in E2, 2019-2023. (a) Gap statistic. (b) ARI stability. (c) Silhouette. (d) Standardized features."
    file: "media/Fig5_states_en.png"
    source: "outputs/figures_article/Fig5_states_en.png"
  - id: fig-6
    caption: "Specification curves. (a) Territorial association. (b) Global spatial autocorrelation."
    file: "media/Fig6_validation_en.png"
    source: "outputs/figures_article/Fig6_validation_en.png"
