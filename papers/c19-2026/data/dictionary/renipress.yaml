  notes: 'Five values: ESTABLECIMIENTO DE SALUD SIN INTERNAMIENTO, ESTABLECIMIENTO DE SALUD CON INTERNAMIENTO,
    SERVICIO MÉDICO DE APOYO, OFERTA FLEXIBLE, COMUNIDADES TERAPÉUTICAS.'
