# Colab spec for c19-2026. The notebook is generated from this file:
#   python scripts/paper_notebook.py --slug c19-2026
# Never edit notebooks/experiments.ipynb by hand. Rules: COLAB.md (repo root).

title: "c19-2026: Travel time to public complex hospitals in Peru: measurement, method sensitivity and an external outcome test"
drive_folder: c19-2026            # MyDrive/<drive_folder>/{code,data,outputs}

# required | optional | none. "required" stops the notebook in cell 2 without a GPU.
gpu: none

# Installed once per runtime (cell 2). Never list torch: Colab ships a CUDA build.
# Packages Colab does not ship are pinned to the versions of the 2026-10-30 run;
# the preinstalled scientific stack is left to the image (pinning numpy forces a
# runtime restart). The versions that actually ran go to outputs/run_meta.json.
pip: [esda==2.9.0, libpysal==4.14.1, rasterio==1.5.2, geopandas==1.2.0, py7zr, pyproj, shapely, statsmodels, scikit-learn, scipy, matplotlib, pandas, numpy, pyarrow, psutil, pyyaml]

# Commands run in order before the pipeline (cell 2); a non-zero exit stops the
# notebook. setup = fetch data; probes = seconds-long checks of anything a long
# stage depends on (network, a binary format, a model download).
setup:
  - [_download_inputs.py]
probes:
  - [_probe_ml.py]

# The pipeline entry point (cell 3). It must accept --mode full|smoke, --force,
# --only STAGE..., --from/--to, and report failures through _colab_runtime
# (COLAB.md, "The pipeline contract").
run: [run_all.py]
report: []
# figures: outputs/figures/*.png

# Files hashed into every stage fingerprint (paths under data/ or outputs/).
state_inputs:
  - data/raw/renipress_2026-10-30.csv
  - data/raw/censo-2025-distrital.csv
  - data/raw/per_admin_boundaries.shp.zip
  - data/raw/per_pop_2025_CN_1km_R2025A_UA_v1.tif
  - data/raw/2020_motorized_friction_surface.zip
  - data/raw/TB_SINADEF_2026-10-30.csv
  - data/raw/hybas_sa_lev01-12_v1c.zip
# Code hashed into every fingerprint besides the stage file itself (globs).
shared_modules: ["_*.py", "config.yaml"]
# First stage whose work changes in smoke mode (EXP_FAST=1); earlier stages are
# shared by smoke and full runs. Unset = every stage.
smoke_from: 02_geo_inputs

# Stage -> what it writes, shown in notebooks/README.md.
stages:
  00_verify_datasets: outputs/logs/verify.txt
  01_clean_renipress: outputs/01_clean_renipress/data_quality_report.csv
  02_geo_inputs: outputs/02_geo_inputs/grid.npz
  02_regions: outputs/02_regions/districts_regions.csv
  03_access_travel_time: outputs/03_access_travel_time/district_access.csv
  04_access_sensitivity: outputs/04_access_sensitivity/stability.csv
  05_need_priority: outputs/05_need_priority/district_priority.csv
  06_spatial_stats: outputs/06_spatial_stats/moran.csv
  07_outcome_sinadef: outputs/07_outcome_sinadef/model_frame.parquet
  08_validation_models: outputs/08_validation_models/summary.json
  09_ml_checks: outputs/09_ml_checks/summary.json
  10_figures_tables: outputs/10_figures_tables/qa.md
