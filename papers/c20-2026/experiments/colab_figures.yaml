# Second notebook for c20-2026: only the paper figures, from the finished run's
# outputs/ on Drive. Generated by:
#   python scripts/paper_notebook.py --slug c20-2026   (writes notebooks/figures.ipynb)
# Never edit notebooks/figures.ipynb by hand. Rules: COLAB.md (repo root).

title: "c20-2026: paper figures (CPU runtime)"
drive_folder: c20-2026            # MyDrive/<drive_folder>/{code,data,outputs}

# Stage 11 reads outputs/ only and draws on the CPU: no GPU needed.
gpu: none

pip:
  - "pandas>=2.0"
  - "pyyaml>=6.0"
  - "tqdm>=4.66"
  - "matplotlib>=3.7"
  - "cartopy>=0.23"
  - "geopandas>=0.14"
  - "graphviz>=0.20"
  - "pillow>=10.0"

setup: []
# Imports the map and diagram stack, downloads the Natural Earth layers and
# checks Graphviz's `dot`: a missing piece stops the notebook in cell 2.
probes:
  - [11_paper_figures.py, --probe]

# --only always re-runs the stage, so every Run all redraws the figures.
run: [run_all.py, --only, 11_paper_figures]
report: []
figures: outputs/figures/paper/Fig*.png

stages:
  11_paper_figures: outputs/figures/paper/Fig*.{png,pdf,csv}, qa.md, qa/ (deuteranopia, grayscale), contact_sheet.png

notes:
  - "Run it after the pipeline notebook has finished: it only reads outputs/."
  - "outputs/figures/paper/qa.md lists every automatic check; a failed check stops cell 5."
