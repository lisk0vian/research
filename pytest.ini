[pytest]
# Two suites are marked slow and skipped by the gate's `-m "not slow"`:
#
#   papers/*/tests          112 tests, ~35s  - each case refits climatologies
#   tests/test_cas_fidelity   6 tests, ~29s  - each compiles LaTeX against a
#                                                  committed reference PDF
#
# Measured on this machine: the gate runs 51 tests in ~5s; plain `pytest -q`
# runs all 169 in ~66s. Marked in papers/conftest.py and tests/conftest.py, so a
# new heavy suite opts in by being registered rather than by remembering a
# decorator on every test.
testpaths = tests papers/c20-2026/tests papers/c26-2026/tests
# Each paper may bring its own tests/conftest.py (guard rails). With the default
# import mode they all land in sys.modules as "conftest" and the last one wins,
# so `import conftest` in one paper's tests sees another paper's module. The
# importlib mode gives every conftest a unique module name.
addopts = --import-mode=importlib
markers =
    slow: skipped in CI by -m "not slow"; run locally with plain pytest