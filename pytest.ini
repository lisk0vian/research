[pytest]
# The repository structure/script tests run everywhere. The per-paper suites
# under papers/*/tests are collected too, but papers/conftest.py marks them slow
# and CI deselects them with `-m "not slow"`, so a push is checked in seconds.
# Run the full suite locally with plain `pytest -q`.
testpaths = tests papers/c20-2026/tests
markers =
    slow: per-paper suite; skipped in CI by -m "not slow", run locally with plain pytest