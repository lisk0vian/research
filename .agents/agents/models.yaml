# Review panel model tiers (single source for scripts/link_agents.py).
# strong runs methodology, leakage, verify-claims and the editor; light runs
# clarity and code quality. Values are per-tool model names. "inherit" means
# the subagent uses the session model (explicit, never silent).
strong:
  claude: opus
  opencode: inherit
light:
  claude: haiku
  opencode: inherit
